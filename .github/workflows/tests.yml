name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.16.8
      - run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Needed by mcp's runtime dependencies (e.g. tzdata/system libs on the runner).
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tzdata

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Warm the HF cache so the server's cache-detection logic flips into
      # offline mode exactly like on a developer machine after first use.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-all-MiniLM-L6-v2

      - name: Download embedding model (first run only)
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('sentence-transformers/all-MiniLM-L6-v2')"

      - name: Run tests
        run: python -m pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build lean image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mcp-memory-bridge:ci
          load: true
      # Smoke test: the containerized server must speak real MCP over stdio.
      # The handshake proves the image, the unbuffered stdout, and the lean
      # (no-ML) mode all work as shipped.
      - name: Smoke test (initialize handshake)
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}' \
            | docker run --rm -i -v "$PWD/smoke.db:/data/memory.db" mcp-memory-bridge:ci \
            | grep -q '"serverInfo"'
